<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本語シーン学習</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Hiragino Sans", "Microsoft YaHei", sans-serif; background: #0f1117; color: #e8eaed; line-height: 1.6; max-width: 720px; margin: 0 auto; padding: 16px 16px 80px; }
  h1 { font-size: 19px; margin-bottom: 4px; }
  .sub { color: #9aa0a6; font-size: 12px; margin-bottom: 16px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tab { padding: 8px 14px; border-radius: 8px; background: #1a1d27; color: #9aa0a6; cursor: pointer; font-size: 13px; border: none; }
  .tab.active { background: #2d5bff; color: #fff; }
  .card { background: #1a1d27; border-radius: 14px; padding: 20px; margin-bottom: 14px; }
  .scene-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: #1a1d27; border-radius: 12px; margin-bottom: 10px; cursor: pointer; }
  .scene-item .title { font-size: 16px; font-weight: 600; }
  .scene-item .meta { font-size: 12px; color: #9aa0a6; margin-top: 2px; }
  .scene-item .badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: #2a2e3d; color: #7ba7ff; }
  .step-bar { display: flex; gap: 4px; margin-bottom: 16px; }
  .step-dot { flex: 1; height: 4px; border-radius: 2px; background: #2a2e3d; }
  .step-dot.active { background: #2d5bff; }
  .step-dot.done { background: #1e8e3e; }
  .big-jp { font-size: 26px; font-weight: 600; text-align: center; margin: 14px 0; line-height: 1.5; }
  .kana { font-size: 15px; text-align: center; color: #7ba7ff; margin-bottom: 8px; }
  .cn { text-align: center; color: #9aa0a6; font-size: 15px; margin-bottom: 10px; }
  .grammar-note { background: #141824; border-left: 3px solid #2d5bff; padding: 10px 14px; border-radius: 6px; font-size: 13px; color: #b8bcc4; margin-top: 12px; }
  .speaker { text-align: center; font-size: 12px; color: #7ba7ff; margin-bottom: 6px; }
  .btn { padding: 12px 20px; border-radius: 10px; border: none; background: #2d5bff; color: #fff; font-size: 15px; cursor: pointer; margin: 4px; font-weight: 500; }
  .btn.ghost { background: #2a2e3d; color: #e8eaed; }
  .btn.good { background: #1e8e3e; }
  .btn.bad { background: #c5221f; }
  .btn.wide { width: 100%; margin: 6px 0; }
  .option { display: block; width: 100%; padding: 14px; margin-bottom: 8px; border-radius: 10px; background: #232734; border: 2px solid transparent; color: #e8eaed; font-size: 15px; text-align: left; cursor: pointer; }
  .option.correct { border-color: #1e8e3e; background: #14301c; }
  .option.wrong { border-color: #c5221f; background: #301414; }
  input, textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #2a2e3d; background: #0f1117; color: #e8eaed; font-size: 15px; font-family: inherit; margin-bottom: 10px; }
  .chat-box { max-height: 380px; overflow-y: auto; margin-bottom: 12px; }
  .msg { padding: 12px 16px; border-radius: 12px; margin-bottom: 10px; font-size: 15px; white-space: pre-wrap; }
  .msg.user { background: #2d5bff; color: #fff; margin-left: 36px; }
  .msg.ai { background: #2a2e3d; margin-right: 36px; }
  .hidden { display: none; }
  .mic-status { text-align: center; font-size: 13px; color: #9aa0a6; margin-top: 8px; min-height: 20px; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat { flex: 1; min-width: 90px; background: #1a1d27; border-radius: 12px; padding: 14px; text-align: center; }
  .stat .num { font-size: 24px; font-weight: 700; color: #7ba7ff; }
  .stat .lbl { font-size: 11px; color: #9aa0a6; margin-top: 4px; }
  .kw-item { display: inline-block; padding: 6px 12px; background: #232734; border-radius: 20px; font-size: 13px; margin: 4px; }
  .quiz-progress { font-size: 13px; color: #9aa0a6; text-align: center; margin-bottom: 12px; }
  .level-result { text-align: center; padding: 24px; }
  .level-big { font-size: 56px; font-weight: 700; color: #7ba7ff; }
</style>
</head>
<body>

<h1>日本語シーン学習</h1>
<div class="sub">日语私教 · 水平测试 · 场景学习 · 跟读纠错</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('home')">首页</button>
  <button class="tab" onclick="showTab('scenes')">场景</button>
  <button class="tab" onclick="showTab('review')">复习</button>
  <button class="tab" onclick="showTab('chat')">AI私教</button>
</div>

<div id="home"></div>
<div id="scenes" class="hidden"></div>
<div id="review" class="hidden"></div>

<div id="chat" class="hidden">
  <div class="card">
    <div style="font-size:14px;color:#9aa0a6;margin-bottom:8px">Claude API Key</div>
    <input type="password" id="api-key" placeholder="sk-ant-...">
    <div style="font-size:14px;color:#9aa0a6;margin:10px 0 8px">你的日语水平</div>
    <input type="text" id="level" value="N5（初学）">
    <button class="btn wide" onclick="saveKey()">保存</button>
  </div>
  <div class="card">
    <div class="chat-box" id="chat-box"></div>
    <textarea id="chat-input" rows="2" placeholder="日本語で話してください..."></textarea>
    <button class="btn wide" onclick="sendChat()">送信</button>
    <button class="btn ghost wide" onclick="clearChat()">クリア</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
